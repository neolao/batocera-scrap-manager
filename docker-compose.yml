services:
  batocera-scrap-manager:
    build: .
    image: batocera-scrap-manager
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - BATOCERA_SCRAP_MANAGER_CONFIG=/data/config.json
    volumes:
      - ${REGISTRY_FOLDER}:/data/registry
      # ROMS_FOLDER is the parent of every ROMs folder to watch; add or
      # remove folders via config.json's "roms_folders", not here — see
      # .env.example.
      - ${ROMS_FOLDER}:/data/roms
      # Not :ro: `docker compose exec batocera-scrap-manager
      # /batocera-scrap-manager config ...` needs to write to it. The server
      # itself only ever reads it.
      - ${CONFIG_FILE}:/data/config.json
