services:
  batocera-scrap-manager:
    build: .
    image: batocera-scrap-manager
    restart: unless-stopped
    # Defaults to the image's built-in non-root uid/gid (65532). Override
    # PUID/PGID in .env when the mounted folders are already owned by
    # another user and can't simply be chowned to 65532 — e.g. a Synology
    # shared folder whose ACL doesn't recognize that uid at all, only the
    # DSM user that created the folder.
    user: "${PUID:-65532}:${PGID:-65532}"
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - BATOCERA_SCRAP_MANAGER_CONFIG=/data/config/config.json
    volumes:
      - ${REGISTRY_FOLDER}:/data/registry
      # ROMS_FOLDER is the parent of every ROMs folder to watch; add or
      # remove folders via config.json's "roms_folders", not here — see
      # .env.example.
      - ${ROMS_FOLDER}:/data/roms
      # A folder, not the config.json file itself: unlike a missing folder,
      # a missing file makes Docker bind-mount a directory in its place,
      # which breaks the server. config.json is created inside it by the
      # `config` subcommand — see .env.example and the README.
      - ${CONFIG_FOLDER}:/data/config
